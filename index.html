<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Venkatesh C is a results-driven Full Stack Developer with 3.6+ years of experience specializing in React.js, Svelte, Node.js, TypeScript, and AWS cloud deployments." />
    <title>Venkatesh C | Full Stack Developer Portfolio</title>
    <!-- Anti-FOUC: apply theme before React hydrates -->
    <style>
      body { background-color: #0b0f19; }
      body.light-theme { background-color: #f0f4ff; }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("portfolio-theme");
          if (t === "light") document.body.classList.add("light-theme");
          else document.body.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
